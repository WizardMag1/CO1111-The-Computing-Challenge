<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CyberQuest Mobile Web App — Play the Code Cyprus Treasure Hunt live on campus."
    />
    <meta
      name="author"
      content="@WizardMag1;@godoflevels;@jaspreetsingh052000-cell"
    />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="assets/icon-192.png" />
    <meta name="theme-color" content="#c8102e" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>CyberQuest — Play Treasure Hunt | UCLan Cyprus</title>
  </head>

  <body>
    <header class="site_header">
      <div class="header_container">
        <div class="site_logo">
          <a href="index.html" class="logo_link">
            <img
              class="logo_badge"
              src="assets/icon-192.png"
              alt="CyberQuest Logo"
            />
            <span class="logo_text">CyberQuest</span>
          </a>
        </div>
        <nav class="main_nav">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="index.html#how_it_works">How to Play</a></li>
            <li><a href="index.html#team">Team</a></li>
            <li><a href="test.html">Testing</a></li>
            <li><a href="notes.html">Notes</a></li>
            <li><a href="app.html" class="nav_cta">Play App</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="game_viewport">
      <div class="clue_card" id="start_screen">
        <div class="card_header">
          <h2>Start Treasure Hunt</h2>
          <p class="section_lead">
            Enter your player name to join the live session.
          </p>
        </div>
        <div id="huntList" class="hunt_list"></div>
        <form id="startForm" class="game_form">
          <input
            type="text"
            id="nameInput"
            class="answer_input"
            placeholder="Your player name..."
            autocomplete="off"
            required
          />
          <button id="startButton" type="submit" class="btn_primary btn_block">
            Start Challenge
          </button>
        </form>
      </div>

      <div id="game" hidden class="clue_card">
        <div class="score_bar">
          <span class="score_label">Current Score</span>
          <span id="score" class="score_value">0</span>
        </div>

        <div class="question_box">
          <p id="question" class="question_text">Loading your question...</p>
        </div>

        <form id="answerForm" class="game_form">
          <input
            type="text"
            id="answer"
            class="answer_input"
            placeholder="Type your answer..."
            autocomplete="off"
            required
          />
          <button type="submit" id="submitAnswer" class="btn_primary btn_block">
            Submit Answer
          </button>
          <button
            type="button"
            id="skipButton"
            class="btn_secondary btn_block"
            hidden
          >
            Skip Question
          </button>
        </form>
        <div id="choices" class="choices_grid" hidden></div>
      </div>

      <p id="message" class="feedback_banner"></p>
    </main>

    <footer class="site_footer">
      <div class="container_footer_container">
        <div class="footer_info">
          <strong>CyberQuest</strong> &mdash; CO1111 The Computing Challenge<br />
          <span class="footer_subtext">UCLan Cyprus</span>
        </div>
        <div class="footer_nav">
          <a href="index.html">Home</a>
          <a href="app.html">App</a>
          <a href="test.html">Testing</a>
          <a href="notes.html">Notes</a>
        </div>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
