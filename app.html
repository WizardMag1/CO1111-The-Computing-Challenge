<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Treasure Hunt</h1>
  <button id="startButton">Start</button>

  <div id="game" hidden>
    <p id="question"></p>
    <form id="answerForm">
      <input type="text" id="answer" placeholder="Your answer">
      <button type="submit">Submit</button>
    </form>
  </div>

  <p id="message"></p>
  <p id="score"></p>
</body>
</html>
